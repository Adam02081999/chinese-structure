<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🇹🇼 繁體中文句型學習 - 語音播放器</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

    <!-- 頂部導覽列 -->
    <header class="bg-teal-700 text-white shadow-md sticky top-0 z-50 p-4 text-center font-bold text-lg flex justify-between items-center px-6">
        <span class="flex items-center gap-2">🇹🇼 繁體中文 A2–B1 核心句型聽力跟讀播放器 (100 句對照版)</span>
        <span id="voiceStatus" class="text-xs bg-teal-800 px-3 py-1 rounded-full font-normal">語音引擎載入中...</span>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-4xl mx-auto px-4 py-8 flex-grow w-full space-y-6">
        
        <!-- 控制面板 -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-4">
                <div>
                    <h1 class="text-2xl font-bold text-slate-900">🇹🇼 繁體中文日常與故事句型隨身聽 (100 句全收錄)</h1>
                    <p class="text-sm text-slate-500 mt-1">含繁體中文 (Taiwan)、拼音對照與英文翻譯註解</p>
                </div>
                <!-- 語速選擇 -->
                <div class="flex items-center space-x-2">
                    <label class="text-sm font-medium text-slate-600">朗讀語速：</label>
                    <select id="rateSelect" class="border rounded-lg px-3 py-1.5 text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-teal-500">
                        <option value="0.5">0.5x (慢速跟讀)</option>
                        <option value="0.75" selected>0.75x (推薦練習)</option>
                        <option value="1.0">1.0x (自然語速)</option>
                    </select>
                </div>
            </div>

            <!-- 控制按鈕 -->
            <div class="flex flex-wrap gap-3 pt-3 border-t border-slate-100 items-center">
                <button onclick="startAutoplay()" id="btn-play" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold shadow-sm transition flex items-center gap-2">
                    ▶ 開始全自動「中文+英文」接續朗讀
                </button>
                <button onclick="pauseAudio()" class="px-4 py-2.5 bg-amber-500 hover:bg-amber-600 text-white rounded-xl font-medium transition">
                    ⏸ 暫停
                </button>
                <button onclick="stopAudio()" class="px-4 py-2.5 bg-rose-50 text-rose-600 hover:bg-rose-100 rounded-xl font-medium transition">
                    ⏹ 停止
                </button>

                <!-- 單句重複切換 -->
                <div class="ml-auto flex items-center space-x-2 text-sm text-slate-600">
                    <label class="flex items-center space-x-1.5 cursor-pointer select-none">
                        <input type="checkbox" id="repeatOneCheck" class="rounded text-teal-600 focus:ring-teal-500 w-4 h-4">
                        <span class="font-medium">單句無限重複</span>
                    </label>
                </div>
            </div>
        </div>

        <!-- 搜尋列 -->
        <div class="flex gap-4">
            <input type="text" id="searchInput" oninput="filterSentences()" placeholder="🔍 搜尋中文、拼音、英文或句型主題..." class="w-full px-4 py-2.5 border rounded-xl bg-white shadow-sm focus:ring-2 focus:ring-teal-500 outline-none text-sm">
        </div>

        <!-- 句子列表 -->
        <div id="sentenceList" class="space-y-4">
            <!-- 由 JavaScript 動態生成 -->
        </div>

    </main>

    <!-- 底部固定播放控制列 -->
    <footer class="bg-white border-t border-slate-200 shadow-lg sticky bottom-0 z-40 py-3 px-6">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="text-sm truncate pr-4">
                <span class="text-slate-400">目前播放：</span>
                <span id="currentPlayingText" class="font-bold text-teal-700">準備就緒，請點擊上方綠色播放鍵開始</span>
            </div>
            <div class="space-x-2 shrink-0">
                <button onclick="prevSentence()" class="px-3.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-sm font-medium transition">上一句</button>
                <button onclick="nextSentence()" class="px-3.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-sm font-medium transition">下一句</button>
            </div>
        </div>
    </footer>

 "py": "Tā zǒu le ma?", "en": "Has he left?", "sec": "13 · 動詞 + 了        verb + le"}, {"id": 64, "zh": "我忘記帶錢包了。", "py": "Wǒ wàngjì dài qiánbāo le.", "en": "I forgot to bring my wallet.", "sec": "13 · 動詞 + 了        verb + le"}, {"id": 65, "zh": "下班了我就過去。", "py": "Xiàbān le wǒ jiù guòqù.", "en": "I'll head over once I finish work.", "sec": "13 · 動詞 + 了        verb + le"}, {"id": 66, "zh": "我去過台南兩次。", "py": "Wǒ qù guò Táinán liǎng cì.", "en": "I've been to Tainan twice.", "sec": "14 · 動詞 + 過        verb + guò"}, {"id": 67, "zh": "你吃過臭豆腐嗎？", "py": "Nǐ chī guò chòudòufu ma?", "en": "Have you ever eaten stinky tofu?", "sec": "14 · 動詞 + 過        verb + guò"}, {"id": 68, "zh": "我沒看過這部電影。", "py": "Wǒ méi kàn guò zhè bù diànyǐng.", "en": "I've never seen this film.", "sec": "14 · 動詞 + 過        verb + guò"}, {"id": 69, "zh": "我好像在哪裡見過你。", "py": "Wǒ hǎoxiàng zài nǎlǐ jiàn guò nǐ.", "en": "I feel like I've met you somewhere.", "sec": "14 · 動詞 + 過        verb + guò"}, {"id": 70, "zh": "這種事我遇過好幾次。", "py": "Zhè zhǒng shì wǒ yù guò hǎo jǐ cì.", "en": "I've run into this sort of thing several times.", "sec": "14 · 動詞 + 過        verb + guò"}, {"id": 71, "zh": "我小的時候住在鄉下。", "py": "Wǒ xiǎo de shíhòu zhù zài xiāngxià.", "en": "When I was little I lived in the countryside.", "sec": "15 · …的時候        … de shíhòu"}, {"id": 72, "zh": "我到的時候，他已經走了。", "py": "Wǒ dào de shíhòu, tā yǐjīng zǒu le.", "en": "When I arrived, he had already left.", "sec": "15 · …的時候        … de shíhòu"}, {"id": 73, "zh": "我正在洗澡的時候，他打電話來。", "py": "Wǒ zhèngzài xǐzǎo de shíhòu, tā dǎ diànhuà lái.", "en": "He called while I was in the shower.", "sec": "15 · …的時候        … de shíhòu"}, {"id": 74, "zh": "那時候我還不會說中文。", "py": "Nà shíhòu wǒ hái bú huì shuō Zhōngwén.", "en": "At that time I still couldn't speak Chinese.", "sec": "15 · …的時候        … de shíhòu"}, {"id": 75, "zh": "吃飯的時候不要看手機。", "py": "Chīfàn de shíhòu búyào kàn shǒujī.", "en": "Don't look at your phone while eating.", "sec": "15 · …的時候        … de shíhòu"}, {"id": 76, "zh": "我一到就打給你。", "py": "Wǒ yí dào jiù dǎ gěi nǐ.", "en": "I'll call you as soon as I arrive.", "sec": "16 · 一…就…        yī … jiù …"}, {"id": 77, "zh": "他一看到我就跑了。", "py": "Tā yí kàndào wǒ jiù pǎo le.", "en": "The moment he saw me, he ran.", "sec": "16 · 一…就…        yī … jiù …"}, {"id": 78, "zh": "我一緊張就說不出話。", "py": "Wǒ yì jǐnzhāng jiù shuō bù chū huà.", "en": "Whenever I get nervous I can't speak.", "sec": "16 · 一…就…        yī … jiù …"}, {"id": 79, "zh": "一下課我們就走。", "py": "Yí xiàkè wǒmen jiù zǒu.", "en": "We'll leave as soon as class ends.", "sec": "16 · 一…就…        yī … jiù …"}, {"id": 80, "zh": "他一喝酒就話很多。", "py": "Tā yì hējiǔ jiù huà hěn duō.", "en": "He talks a lot as soon as he drinks.", "sec": "16 · 一…就…        yī … jiù …"}, {"id": 81, "zh": "我本來想去，後來太累就沒去。", "py": "Wǒ běnlái xiǎng qù, hòulái tài lèi jiù méi qù.", "en": "I'd planned to go, but later I was too tired so I didn't.", "sec": "17 · 本來…後來…        běnlái … hòulái …"}, {"id": 82, "zh": "我本來以為很難，後來發現很簡單。", "py": "Wǒ běnlái yǐwéi hěn nán, hòulái fāxiàn hěn jiǎndān.", "en": "I'd thought it was hard, but then I found it easy.", "sec": "17 · 本來…後來…        běnlái … hòulái …"}, {"id": 83, "zh": "我們本來說好七點。", "py": "Wǒmen běnlái shuō hǎo qī diǎn.", "en": "We'd originally agreed on seven.", "sec": "17 · 本來…後來…        běnlái … hòulái …"}, {"id": 84, "zh": "後來怎麼樣了？", "py": "Hòulái zěnmeyàng le?", "en": "What happened after that?", "sec": "17 · 本來…後來…        běnlái … hòulái …"}, {"id": 85, "zh": "後來我才知道他是誰。", "py": "Hòulái wǒ cái zhīdào tā shì shéi.", "en": "Only later did I find out who he was.", "sec": "17 · 本來…後來…        běnlái … hòulái …"}, {"id": 86, "zh": "結果他根本沒來。", "py": "Jiéguǒ tā gēnběn méi lái.", "en": "And in the end he didn't come at all.", "sec": "18 · 結果… / 沒想到…        jiéguǒ … / méi xiǎngdào …"}, {"id": 87, "zh": "沒想到會這麼順利。", "py": "Méi xiǎngdào huì zhème shùnlì.", "en": "I never thought it would go so smoothly.", "sec": "18 · 結果… / 沒想到…        jiéguǒ … / méi xiǎngdào …"}, {"id": 88, "zh": "誰知道下一秒就下雨了。", "py": "Shéi zhīdào xià yì miǎo jiù xiàyǔ le.", "en": "And who knew, the next second it started raining.", "sec": "18 · 結果… / 沒想到…        jiéguǒ … / méi xiǎngdào …"}, {"id": 89, "zh": "結果我們走了一個小時。", "py": "Jiéguǒ wǒmen zǒu le yí ge xiǎoshí.", "en": "We ended up walking for an hour.", "sec": "18 · 結果… / 沒想到…        jiéguǒ … / méi xiǎngdào …"}, {"id": 90, "zh": "突然，所有人都安靜了。", "py": "Túrán, suǒyǒu rén dōu ānjìng le.", "en": "Suddenly, everyone went quiet.", "sec": "18 · 結果… / 沒想到…        jiéguǒ … / méi xiǎngdào …"}, {"id": 91, "zh": "他跟我說他明天不來。", "py": "Tā gēn wǒ shuō tā míngtiān bù lái.", "en": "He told me he isn't coming tomorrow.", "sec": "19 · 他跟我說…        tā gēn wǒ shuō …"}, {"id": 92, "zh": "她告訴我那家店關了。", "py": "Tā gàosù wǒ nà jiā diàn guān le.", "en": "She told me that shop has closed.", "sec": "19 · 他跟我說…        tā gēn wǒ shuō …"}, {"id": 93, "zh": "他問我要不要一起去。", "py": "Tā wèn wǒ yào bú yào yìqǐ qù.", "en": "He asked me whether I wanted to go along.", "sec": "19 · 他跟我說…        tā gēn wǒ shuō …"}, {"id": 94, "zh": "我跟他說：「沒關係。」", "py": "Wǒ gēn tā shuō: \"Méi guānxi.\"", "en": "I said to him, \"It's fine.\"", "sec": "19 · 他跟我說…        tā gēn wǒ shuō …"}, {"id": 95, "zh": "聽說他要搬家了。", "py": "Tīngshuō tā yào bānjiā le.", "en": "I hear he's moving house.", "sec": "19 · 他跟我說…        tā gēn wǒ shuō …"}, {"id": 96, "zh": "我把門關起來了。", "py": "Wǒ bǎ mén guān qǐlái le.", "en": "I shut the door.", "sec": "20 · 把 + 受詞 + 動詞        bǎ + object + verb"}, {"id": 97, "zh": "他把我的咖啡喝完了。", "py": "Tā bǎ wǒ de kāfēi hē wán le.", "en": "He drank up my coffee.", "sec": "20 · 把 + 受詞 + 動詞        bǎ + object + verb"}, {"id": 98, "zh": "我不小心把手機弄壞了。", "py": "Wǒ bù xiǎoxīn bǎ shǒujī nòng huài le.", "en": "I accidentally broke my phone.", "sec": "20 · 把 + 受詞 + 動詞        bǎ + object + verb"}, {"id": 99, "zh": "請把東西放在這裡。", "py": "Qǐng bǎ dōngxi fàng zài zhèlǐ.", "en": "Please put the things here.", "sec": "20 · 把 + 受詞 + 動詞        bǎ + object + verb"}, {"id": 100, "zh": "我把錢包忘在家裡了。", "py": "Wǒ bǎ qiánbāo wàng zài jiālǐ le.", "en": "I left my wallet at home.", "sec": "20 · 把 + 受詞 + 動詞        bǎ + object + verb"}];

        let displaySentences = [...rawSentences];
        let currentIdx = 0;
        let isAutoplayActive = false;
        let synth = window.speechSynthesis;

        function initVoices() {
            let voices = synth.getVoices();
            if (voices.length > 0) {
                // 優先選擇 zh-TW 台灣繁體中文發音
                const zhVoice = voices.find(v => v.lang === 'zh-TW') || 
                                voices.find(v => v.lang.startsWith('zh-HK')) || 
                                voices.find(v => v.lang.startsWith('zh'));
                const statusEl = document.getElementById('voiceStatus');
                if (zhVoice) {
                    statusEl.innerText = `語音引擎：${zhVoice.name} (${zhVoice.lang})`;
                    statusEl.className = "text-xs bg-emerald-700 px-3 py-1 rounded-full font-normal";
                } else {
                    statusEl.innerText = "語音引擎已就緒 (使用系統預設中文)";
                    statusEl.className = "text-xs bg-emerald-700 px-3 py-1 rounded-full font-normal";
                }
            }
        }

        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = initVoices;
        }

        function renderList() {
            const container = document.getElementById('sentenceList');
            container.innerHTML = '';
            
            displaySentences.forEach((item, index) => {
                const card = document.createElement('div');
                card.id = `card-${index}`;
                card.className = `bg-white p-5 rounded-2xl shadow-sm border transition-all ${index === currentIdx ? 'border-teal-500 ring-2 ring-teal-100 bg-teal-50/20' : 'border-slate-100 hover:border-slate-200'}`;
                card.innerHTML = `
                    <div class="flex items-start justify-between gap-3">
                        <div class="space-y-1.5">
                            <div class="flex items-center gap-2">
                                <span class="text-xs font-bold text-teal-700 bg-teal-100/80 px-2.5 py-0.5 rounded-full">#${item.id}</span>
                                ${item.sec ? `<span class="text-xs font-medium text-slate-500">${item.sec}</span>` : ''}
                            </div>
                            <h2 class="text-xl font-bold text-slate-900 pt-0.5">${item.zh}</h2>
                            <p class="text-teal-800 text-sm font-semibold tracking-wide font-mono">${item.py}</p>
                            <p class="text-slate-600 text-sm font-medium">${item.en}</p>
                        </div>
                        <button onclick="playSingle(${index})" class="bg-teal-600 hover:bg-teal-700 text-white px-3.5 py-2 rounded-xl text-xs font-bold shadow-sm transition shrink-0 flex items-center gap-1">
                            🔊 單句朗讀
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function scrollToCurrent() {
            const el = document.getElementById(`card-${currentIdx}`);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function playSingle(index) {
            unlockAudio();
            isAutoplayActive = false;
            currentIdx = index;
            renderList();
            scrollToCurrent();
            playCurrentSentence();
        }

        function startAutoplay() {
            unlockAudio();
            isAutoplayActive = true;
            renderList();
            scrollToCurrent();
            playCurrentSentence();
        }

        function unlockAudio() {
            if (synth.paused) synth.resume();
            let u = new SpeechSynthesisUtterance("");
            synth.speak(u);
        }

        function playCurrentSentence() {
            synth.cancel();

            if (currentIdx >= displaySentences.length) return;

            const item = displaySentences[currentIdx];
            document.getElementById('currentPlayingText').innerText = `#${item.id} - ${item.zh} (${item.py})`;

            const rate = parseFloat(document.getElementById('rateSelect').value);
            const isRepeatOne = document.getElementById('repeatOneCheck').checked;

            let voices = synth.getVoices();
            // 優先選擇 zh-TW 繁體中文
            let zhVoice = voices.find(v => v.lang === 'zh-TW') || 
                          voices.find(v => v.lang.startsWith('zh-HK')) || 
                          voices.find(v => v.lang.startsWith('zh')) || null;
            
            let enVoice = voices.find(v => v.lang === 'en-US') || 
                          voices.find(v => v.lang.startsWith('en')) || null;

            // 1. 朗讀繁體中文
            speakText(item.zh, 'zh-TW', zhVoice, rate, () => {
                // 2. 停頓 0.5 秒後朗讀英文對照
                setTimeout(() => {
                    speakText(item.en, 'en-US', enVoice, rate, () => {
                        if (isRepeatOne) {
                            setTimeout(playCurrentSentence, 800);
                        } else if (isAutoplayActive) {
                            if (currentIdx < displaySentences.length - 1) {
                                currentIdx++;
                                renderList();
                                scrollToCurrent();
                                setTimeout(playCurrentSentence, 1000);
                            } else {
                                isAutoplayActive = false;
                                document.getElementById('currentPlayingText').innerText = "🎉 播放完畢！";
                            }
                        }
                    });
                }, 500);
            });
        }

        function speakText(text, langCode, voiceObj, rate, callback) {
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = langCode;
            if (voiceObj) utterance.voice = voiceObj;
            utterance.rate = rate;
            
            utterance.onend = () => { if (callback) callback(); };
            utterance.onerror = (e) => { 
                console.error("TTS Error:", e);
                if (callback) callback(); 
            };

            synth.speak(utterance);
        }

        function pauseAudio() {
            isAutoplayActive = false;
            synth.cancel();
            document.getElementById('currentPlayingText').innerText = "已暫停播放";
        }

        function stopAudio() {
            isAutoplayActive = false;
            currentIdx = 0;
            synth.cancel();
            renderList();
            document.getElementById('currentPlayingText').innerText = "已停止播放";
        }

        function nextSentence() {
            if (currentIdx < displaySentences.length - 1) {
                currentIdx++;
                renderList();
                scrollToCurrent();
                playCurrentSentence();
            }
        }

        function prevSentence() {
            if (currentIdx > 0) {
                currentIdx--;
                renderList();
                scrollToCurrent();
                playCurrentSentence();
            }
        }

        function filterSentences() {
            const q = document.getElementById('searchInput').value.toLowerCase().trim();
            displaySentences = rawSentences.filter(s => 
                s.zh.toLowerCase().includes(q) || 
                s.py.toLowerCase().includes(q) ||
                s.en.toLowerCase().includes(q) || 
                s.sec.toLowerCase().includes(q)
            );
            currentIdx = 0;
            renderList();
        }

        window.onload = () => {
            renderList();
            initVoices();
        };
    </script>
